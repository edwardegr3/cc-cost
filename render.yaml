# Render Blueprint: web service + PostgreSQL database.
# Deploys automatically from the main branch on GitHub.
services:
  - type: web
    name: cc-cost
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cc-cost-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"

databases:
  - name: cc-cost-db
    databaseName: cc_cost
